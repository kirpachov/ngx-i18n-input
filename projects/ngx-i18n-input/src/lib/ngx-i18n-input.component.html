<!-------------------  TEMPLATES ------------------->
<ng-template #defaultlabelTemplate let-all>
  <span [ngClass]="{'underline decoration-wavy decoration-red-500': all.control.touched && all.control.invalid && (layout === 'vertical' || !isActiveLang(all.lang))}">
    {{ all.configs.formatLabel(all.lang, all.configs.label) }}
  </span>
</ng-template>

<ng-template #actualLabel let-all>
  <ng-container *ngTemplateOutlet="labelTemplate || defaultlabelTemplate; context: {
    $implicit: {
      lang: all.lang,
      control: forms.controls[all.lang],
      id: all.id,
      configs: all.configs
    }
    }"></ng-container>
</ng-template>

<!-------------------  CONTENT ------------------->
<form class="layout-{{ layout }}" [ngClass]="{'labels-hidden': hideLabels}" [formGroup]="forms">
  <ng-container [ngSwitch]="layout">
    <ng-container *ngSwitchCase="'tabs'">
      <ul *ngIf="!hideLabels"
      class="m-0 p-0 flex flex-wrap text-sm font-medium text-center text-gray-500 border-b border-gray-200">
      <ng-container *ngFor="let lang of availableLangs;">
        <li class="me-2">
          <label for="input-{{uid}}-{{lang}}" (click)="focusInput(lang)"
            class="inline-block px-4 py-3 rounded-t-lg cursor-pointer" [ngClass]="{
              'text-blue-600 bg-gray-100 active': isActiveLang(lang),
              'hover:text-gray-600 hover:bg-gray-50': !isActiveLang(lang)
              }">
            <ng-container *ngTemplateOutlet="actualLabel; context: { $implicit: { lang: lang, configs } }"></ng-container>
          </label>
        </li>
      </ng-container>
    </ul>
  
    <ng-container *ngFor="let lang of availableLangs;">
      <div id="{{ containerId(lang) }}" [ngClass]="{
        'hidden': !isActiveLang(lang)
      }">
        <lib-ngx-i18n-input-single-lang-input
          [inputId]="inputId(lang)"
          (onCustomEvent)="onCustomEvent.emit($event)"
          [configs]="configs"
          [formControlName]="lang"
          [lang]="lang"
        ></lib-ngx-i18n-input-single-lang-input>
      </div>
    </ng-container>
    </ng-container>

    <ng-container *ngSwitchDefault>
      <ng-container *ngFor="let lang of availableLangs">
        <div class="block mb-4">
          <div class="flex flex-col">
            <label *ngIf="!hideLabels" for="input-{{ uid }}-{{ lang }}">
              <ng-container *ngTemplateOutlet="actualLabel; context: { $implicit: { lang: lang, configs } }"></ng-container>
            </label>
    
            <div id="{{ containerId(lang) }}">
              <lib-ngx-i18n-input-single-lang-input
                [inputId]="inputId(lang)"
                (onCustomEvent)="onCustomEvent.emit($event)"
                [configs]="configs"
                [formControlName]="lang"
                [lang]="lang"
              ></lib-ngx-i18n-input-single-lang-input>
            </div>
          </div>
        </div>
      </ng-container>
    </ng-container>
  </ng-container>
</form>
